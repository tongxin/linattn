[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "linattn"
version = "0.1.0"
description = "Survey plus reference implementations, kernels and validation harness for sparse, compressed-state and co-designed attention variants"
readme = "README.md"
# Upper bound is deliberate: PyTorch wheels stop at cp314, and on 3.15 the resolver
# fails only *after* downloading everything (see docs/reproducing.md).
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [{ name = "linattn contributors" }]
# torch is the only hard dependency: every variant, kernel wrapper, benchmark and
# experiment in this repository runs on CPU with nothing else installed.
dependencies = ["torch>=2.4"]

[project.optional-dependencies]
# `pytest` is needed for `make check`; `triton` only for the CUDA parity tests
# (`pytest -m gpu`), which are skipped automatically when no GPU is present.
dev = ["pytest>=7.4"]
gpu = ["triton>=3.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/linattn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: long running tests",
    "gpu: requires a CUDA GPU (skipped automatically when unavailable)",
]

[tool.ruff]
line-length = 120
target-version = "py310"
